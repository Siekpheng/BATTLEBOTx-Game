<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BATTLEBOTx - Automated 6-Robot Round-Robin Tournament</title>
  <style>
    body {
      background: #060a12;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      line-height: 1.5;
    }
    h1, h2 {
      color: #38bdf8;
      font-family: monospace;
      letter-spacing: 1px;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .rank-1 { color: #fdc911; border-color: #fdc911; background: rgba(253, 201, 17, 0.1); }
    .rank-2 { color: #94a3b8; border-color: #94a3b8; background: rgba(148, 163, 184, 0.1); }
    .rank-3 { color: #d97706; border-color: #d97706; background: rgba(217, 119, 6, 0.1); }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 15px 0 25px 0;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #1e293b;
      padding: 10px 14px;
      text-align: left;
    }
    th {
      background: #1e293b;
      color: #38bdf8;
      font-size: 13px;
      text-transform: uppercase;
    }
    tr:nth-child(even) {
      background: #0b1120;
    }
    .matrix-cell {
      text-align: center;
      font-weight: bold;
    }
    .matrix-win { color: #4ade80; background: rgba(74, 222, 128, 0.08); }
    .matrix-loss { color: #f87171; background: rgba(248, 113, 113, 0.08); }
    .matrix-tie { color: #94a3b8; }
    .matrix-self { background: #1e293b; color: #475569; }
    #status-banner {
      padding: 12px 18px;
      border-radius: 6px;
      background: #1e293b;
      border-left: 4px solid #38bdf8;
      margin-bottom: 20px;
      font-weight: 600;
    }
    pre {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      max-height: 300px;
    }
  </style>

  <!-- Three.js + GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    // Initialize global scene and stubs before game scripts load
    window.scene = new THREE.Scene();
    window.AudioSys = {
      metalClashSound: () => {},
      weaponSliceSound: () => {},
      weaponStallSound: () => {},
      wallHitSound: () => {},
      crowdCheer: () => {},
      crowdGasp: () => {},
      init: () => {}
    };
    window.spawnCollisionSparks = () => {};
    window.triggerHitStop = () => {};
    window.addCameraTrauma = () => {};
    window.triggerGamepadRumble = () => {};
    window.triggerDamageVignette = () => {};
    window.gameMode = 'bot';
    window.matchState = 'playing';
    window.endMatch = () => {};
    window.NetworkSys = { isOnline: false, isHost: false, queueEvent: () => {} };
  </script>

  <!-- Game Scripts -->
  <script src="js/state.js?v=20261107_v162"></script>
  <script src="js/audio.js?v=20261107_v162"></script>
  <script src="js/arena.js?v=20261107_v162"></script>
  <script src="js/particles.js?v=20261107_v162"></script>
  <script src="js/robots.js?v=20261107_v162"></script>
  <script src="js/physics.js?v=20261107_v162"></script>
  <script src="js/game.js?v=20261107_v162"></script>
</head>
<body>
  <h1>BATTLEBOTx &mdash; Automated 6-Robot Round-Robin Tournament</h1>
  <div id="status-banner">Initializing simulation engine and loading 3D CAD bot models...</div>

  <div id="tournament-container" style="display:none;">
    <h2>Final Tournament Standings</h2>
    <div id="standings-table"></div>

    <h2>Head-to-Head Win/Loss Matrix</h2>
    <div id="matrix-table"></div>

    <h2>Match Summary Log</h2>
    <div id="match-log" style="max-height: 400px; overflow-y: auto;"></div>

    <h2>Raw JSON Data</h2>
    <pre id="raw-json"></pre>
  </div>

  <script>
    // Audio stub to avoid Web Audio warnings during headless execution
    window.AudioSys = {
      metalClashSound: () => {},
      weaponSliceSound: () => {},
      weaponStallSound: () => {},
      wallHitSound: () => {},
      crowdCheer: () => {},
      crowdGasp: () => {},
      init: () => {}
    };

    // Particles stub
    window.spawnCollisionSparks = () => {};
    window.triggerHitStop = () => {};
    window.addCameraTrauma = () => {};
    window.triggerGamepadRumble = () => {};
    window.triggerDamageVignette = () => {};

    // Global match state
    window.gameMode = 'bot';
    window.matchState = 'playing';

    const BOT_ROSTER = ['robot1', 'robot2', 'robot3', 'robot4', 'robot5', 'robot6'];
    const ROUNDS_PER_MATCHUP = 5; // 5 rounds per pair = 75 matches total!

    async function runTournament() {
      const banner = document.getElementById('status-banner');
      banner.textContent = 'Loading all 6 3D CAD robot models into physics memory...';

      // Load all 6 models
      for (const botType of BOT_ROSTER) {
        banner.textContent = `Loading CAD model for ${botType}...`;
        await ensureBotModelLoaded(botType);
      }

      banner.textContent = 'All models loaded! Running 75-match Round-Robin Tournament...';

      const botStats = {};
      const headToHead = {};

      for (const b of BOT_ROSTER) {
        const specs = getBotCombatSpecs(b);
        botStats[b] = {
          id: b,
          name: specs.name,
          role: specs.role,
          matches: 0,
          wins: 0,
          losses: 0,
          draws: 0,
          points: 0, // 3 for win, 1 for draw
          kosFor: 0,
          kosAgainst: 0,
          totalDamageDealt: 0,
          totalDamageTaken: 0,
          totalPartsDetachedFor: 0,
          totalPartsLost: 0,
          totalDuration: 0
        };
        headToHead[b] = {};
        for (const o of BOT_ROSTER) {
          headToHead[b][o] = { wins: 0, losses: 0, draws: 0 };
        }
      }

      const matchLogs = [];
      let matchCount = 0;
      const totalMatches = 15 * ROUNDS_PER_MATCHUP;

      // 15 Pairwise Matchups
      for (let i = 0; i < BOT_ROSTER.length; i++) {
        for (let j = i + 1; j < BOT_ROSTER.length; j++) {
          const typeA = BOT_ROSTER[i];
          const typeB = BOT_ROSTER[j];

          for (let round = 1; round <= ROUNDS_PER_MATCHUP; round++) {
            matchCount++;
            banner.textContent = `Simulating Match ${matchCount}/${totalMatches}: ${botStats[typeA].name} vs ${botStats[typeB].name} (Round ${round}/${ROUNDS_PER_MATCHUP})...`;
            await new Promise(r => setTimeout(r, 0));

            // Alternate starting positions to avoid positional bias
            const isAFirst = (round % 2 === 1);
            const pType = isAFirst ? typeA : typeB;
            const eType = isAFirst ? typeB : typeA;

            const res = simulateSingleMatch(pType, eType, matchCount);
            matchLogs.push(res);

            // Update stats
            const bot1 = res.pBotType;
            const bot2 = res.eBotType;

            botStats[bot1].matches++;
            botStats[bot2].matches++;
            botStats[bot1].totalDamageDealt += res.pDamageDealt;
            botStats[bot2].totalDamageDealt += res.eDamageDealt;
            botStats[bot1].totalDamageTaken += res.eDamageDealt;
            botStats[bot2].totalDamageTaken += res.pDamageDealt;
            botStats[bot1].totalDuration += res.duration;
            botStats[bot2].totalDuration += res.duration;

            if (res.winner === 'player') {
              botStats[bot1].wins++;
              botStats[bot1].points += 3;
              botStats[bot2].losses++;
              headToHead[bot1][bot2].wins++;
              headToHead[bot2][bot1].losses++;
              if (res.outcomeType === 'KO') {
                botStats[bot1].kosFor++;
                botStats[bot2].kosAgainst++;
              }
            } else if (res.winner === 'enemy') {
              botStats[bot2].wins++;
              botStats[bot2].points += 3;
              botStats[bot1].losses++;
              headToHead[bot2][bot1].wins++;
              headToHead[bot1][bot2].losses++;
              if (res.outcomeType === 'KO') {
                botStats[bot2].kosFor++;
                botStats[bot1].kosAgainst++;
              }
            } else {
              botStats[bot1].draws++;
              botStats[bot2].draws++;
              botStats[bot1].points += 1;
              botStats[bot2].points += 1;
              headToHead[bot1][bot2].draws++;
              headToHead[bot2][bot1].draws++;
            }
          }
        }
      }

      banner.textContent = `Tournament complete! ${totalMatches} matches finished. Rendering results...`;
      renderResults(botStats, headToHead, matchLogs);
    }

    function simulateSingleMatch(pType, eType, matchId) {
      cleanupBots();

      // Spawn at standard match coordinates
      playerBot = createBotInstance(pType, 0, 9.626, Math.PI);
      enemyBot = createBotInstance(eType, 0, -9.626, 0);

      // Start weapons spun up to ready combat speed
      const pSpecs = getBotCombatSpecs(pType);
      const eSpecs = getBotCombatSpecs(eType);
      playerBot.weaponActive = true;
      enemyBot.weaponActive = true;
      playerBot.weaponSpinSpeed = pSpecs.maxWeaponRpm;
      enemyBot.weaponSpinSpeed = eSpecs.maxWeaponRpm;

      const pMaxHp = pSpecs.maxHealth || 900;
      const eMaxHp = eSpecs.maxHealth || 900;

      playerBot.driveHealth = pMaxHp;
      playerBot.maxDriveHealth = pMaxHp;
      enemyBot.driveHealth = eMaxHp;
      enemyBot.maxDriveHealth = eMaxHp;

      const dt = 0.016; // 60 FPS physics tick
      const maxSeconds = 180; // 3-minute standard BattleBots match
      const maxSteps = Math.round(maxSeconds / dt); // 11,250 steps

      let pStopTimer = 0.0;
      let eStopTimer = 0.0;
      let winner = null;
      let outcomeType = '';
      let winReason = '';
      let simTime = 0.0;

      for (let step = 0; step < maxSteps; step++) {
        simTime += dt;

        // Drive both bots using combat AI
        driveMenuBotAI(playerBot, enemyBot, dt, true);
        driveMenuBotAI(enemyBot, playerBot, dt, false);

        // Integrate physics
        updateBotPhysics(playerBot, dt);
        updateBotPhysics(enemyBot, dt);

        // Resolve collision, weapon bites, grinding, and part detachment
        handleBotCollision();

        // 1. Catastrophic HP Depletion / Chassis Destruction
        if (playerBot.isEntirelyDestroyed || playerBot.driveHealth <= 0) {
          winner = 'enemy';
          outcomeType = 'KO';
          winReason = 'Destruction (Total Chassis HP Depleted)';
          break;
        }
        if (enemyBot.isEntirelyDestroyed || enemyBot.driveHealth <= 0) {
          winner = 'player';
          outcomeType = 'KO';
          winReason = 'Destruction (Total Chassis HP Depleted)';
          break;
        }

        // 2. Wheel Loss / Flip Immobilization & Referee 10s Countout
        const pHasWheels = (playerBot.wheels && playerBot.wheels.some(w => w.attached !== false));
        const eHasWheels = (enemyBot.wheels && enemyBot.wheels.some(w => w.attached !== false));

        const pImmobilized = (!pHasWheels || playerBot.flipped || playerBot.drivePower <= 0);
        const eImmobilized = (!eHasWheels || enemyBot.flipped || enemyBot.drivePower <= 0);

        if (pImmobilized) {
          pStopTimer += dt;
        } else {
          pStopTimer = Math.max(0, pStopTimer - dt * 2.0);
        }

        if (eImmobilized) {
          eStopTimer += dt;
        } else {
          eStopTimer = Math.max(0, eStopTimer - dt * 2.0);
        }

        if (pStopTimer >= 10.0 && eStopTimer >= 10.0) {
          // Double KO
          winner = 'draw';
          outcomeType = 'Draw';
          winReason = 'Simultaneous Immobilization (Mutual Countout)';
          break;
        } else if (pStopTimer >= 10.0) {
          winner = 'enemy';
          outcomeType = 'KO';
          winReason = !pHasWheels ? 'Referee KO (All Wheels Ripped Off)' : 'Referee KO (Flipped / No Drive Traction)';
          break;
        } else if (eStopTimer >= 10.0) {
          winner = 'player';
          outcomeType = 'KO';
          winReason = !eHasWheels ? 'Referee KO (All Wheels Ripped Off)' : 'Referee KO (Flipped / No Drive Traction)';
          break;
        }
      }

      // 3. Time Limit Expired -> Judges' Decision
      if (!winner) {
        outcomeType = 'Decision';
        const pRatio = Math.max(0, playerBot.driveHealth) / pMaxHp;
        const eRatio = Math.max(0, enemyBot.driveHealth) / eMaxHp;

        if (Math.abs(pRatio - eRatio) < 0.03) {
          winner = 'draw';
          winReason = `Judges' Draw (P1: ${(pRatio*100).toFixed(1)}% vs P2: ${(eRatio*100).toFixed(1)}%)`;
        } else if (pRatio > eRatio) {
          winner = 'player';
          winReason = `Judges' Decision (${(pRatio*100).toFixed(1)}% HP vs ${(eRatio*100).toFixed(1)}% HP)`;
        } else {
          winner = 'enemy';
          winReason = `Judges' Decision (${(eRatio*100).toFixed(1)}% HP vs ${(pRatio*100).toFixed(1)}% HP)`;
        }
      }

      const pDamageDealt = Math.max(0, eMaxHp - enemyBot.driveHealth);
      const eDamageDealt = Math.max(0, pMaxHp - playerBot.driveHealth);

      const winningType = (winner === 'player') ? pType : ((winner === 'enemy') ? eType : 'Draw');

      return {
        matchId,
        pBotType: pType,
        eBotType: eType,
        winner,
        winningType,
        outcomeType,
        winReason,
        duration: Math.round(simTime * 10) / 10,
        pRemainingHp: Math.max(0, playerBot.driveHealth),
        eRemainingHp: Math.max(0, enemyBot.driveHealth),
        pDamageDealt,
        eDamageDealt
      };
    }

    function renderResults(botStats, headToHead, matchLogs) {
      document.getElementById('tournament-container').style.display = 'block';
      const banner = document.getElementById('status-banner');

      // Sort bots by points desc, then wins desc, then total damage desc
      const sorted = Object.values(botStats).sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        if (b.wins !== a.wins) return b.wins - a.wins;
        return b.totalDamageDealt - a.totalDamageDealt;
      });

      const champion = sorted[0];
      banner.innerHTML = `<span style="font-size: 18px; color: #fdc911;">&#127942; TOURNAMENT CHAMPION: <strong>${champion.name} (${champion.id.toUpperCase()})</strong> &mdash; ${champion.wins} Wins / ${champion.losses} Losses (${((champion.wins/champion.matches)*100).toFixed(1)}% Win Rate)!</span>`;

      // Standings Table
      let stHtml = `<table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Robot</th>
            <th>Archetype</th>
            <th>Matches</th>
            <th>W - L - D</th>
            <th>Win Rate</th>
            <th>Points</th>
            <th>KOs</th>
            <th>Avg Time</th>
            <th>Damage Dealt</th>
          </tr>
        </thead>
        <tbody>`;

      sorted.forEach((b, idx) => {
        const rank = idx + 1;
        const rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
        const winPct = ((b.wins / b.matches) * 100).toFixed(1);
        const avgTime = (b.totalDuration / b.matches).toFixed(1);

        stHtml += `<tr>
          <td><span class="badge ${rankClass}">#${rank}</span></td>
          <td><strong>${b.name}</strong> <span style="font-size:11px; color:#64748b;">(${b.id})</span></td>
          <td>${b.role}</td>
          <td>${b.matches}</td>
          <td><strong>${b.wins}</strong> - ${b.losses} - ${b.draws}</td>
          <td><strong>${winPct}%</strong></td>
          <td style="color:#38bdf8; font-weight:bold;">${b.points} pts</td>
          <td>${b.kosFor}</td>
          <td>${avgTime}s</td>
          <td>${Math.round(b.totalDamageDealt)} HP</td>
        </tr>`;
      });
      stHtml += `</tbody></table>`;
      document.getElementById('standings-table').innerHTML = stHtml;

      // Head-to-Head Matrix Table
      let mHtml = `<table>
        <thead>
          <tr>
            <th>Robot vs Opponent</th>`;
      for (const b of BOT_ROSTER) {
        mHtml += `<th>${botStats[b].name}</th>`;
      }
      mHtml += `<th>Total Wins</th></tr></thead><tbody>`;

      for (const rowBot of BOT_ROSTER) {
        mHtml += `<tr><td><strong>${botStats[rowBot].name}</strong></td>`;
        for (const colBot of BOT_ROSTER) {
          if (rowBot === colBot) {
            mHtml += `<td class="matrix-cell matrix-self">&mdash;</td>`;
          } else {
            const h2h = headToHead[rowBot][colBot];
            const cls = h2h.wins > h2h.losses ? 'matrix-win' : (h2h.wins < h2h.losses ? 'matrix-loss' : 'matrix-tie');
            mHtml += `<td class="matrix-cell ${cls}">${h2h.wins} - ${h2h.losses}${h2h.draws > 0 ? ' ('+h2h.draws+'D)' : ''}</td>`;
          }
        }
        mHtml += `<td style="text-align:center; font-weight:bold; color:#38bdf8;">${botStats[rowBot].wins}W</td></tr>`;
      }
      mHtml += `</tbody></table>`;
      document.getElementById('matrix-table').innerHTML = mHtml;

      // Match Log Summary
      let lHtml = `<table>
        <thead>
          <tr>
            <th>#</th>
            <th>P1</th>
            <th>P2</th>
            <th>Winner</th>
            <th>Outcome</th>
            <th>Duration</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>`;

      matchLogs.forEach(m => {
        const pName = botStats[m.pBotType].name;
        const eName = botStats[m.eBotType].name;
        const winName = m.winner === 'player' ? pName : (m.winner === 'enemy' ? eName : 'Draw');
        const winColor = m.winner === 'player' ? '#38bdf8' : (m.winner === 'enemy' ? '#f43f5e' : '#94a3b8');

        lHtml += `<tr>
          <td>${m.matchId}</td>
          <td>${pName}</td>
          <td>${eName}</td>
          <td style="color:${winColor}; font-weight:bold;">${winName}</td>
          <td><span class="badge ${m.outcomeType === 'KO' ? 'rank-1' : ''}">${m.outcomeType}</span></td>
          <td>${m.duration}s</td>
          <td style="font-size:12px; color:#cbd5e1;">${m.winReason}</td>
        </tr>`;
      });
      lHtml += `</tbody></table>`;
      document.getElementById('match-log').innerHTML = lHtml;

      // Save raw JSON
      const fullResults = {
        timestamp: new Date().toISOString(),
        champion: champion.name,
        championId: champion.id,
        sortedStandings: sorted,
        headToHead,
        matches: matchLogs
      };
      window.tournamentResults = fullResults;
      document.getElementById('raw-json').textContent = JSON.stringify(fullResults, null, 2);

      fetch('/save_tournament', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fullResults)
      }).catch(e => console.log('POST save_tournament failed:', e));
    }

    // Auto-run when window loads
    window.addEventListener('DOMContentLoaded', () => {
      runTournament().catch(err => {
        console.error('Tournament Error:', err);
        const banner = document.getElementById('status-banner');
        banner.style.borderLeftColor = '#ef4444';
        banner.textContent = 'Error running tournament: ' + (err.stack || err.message);
      });
    });
  </script>
</body>
</html>
